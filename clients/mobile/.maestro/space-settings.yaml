appId: dev.horologia.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "(My Tasks|Library|Account settings)"
    timeout: 20000
- tapOn: "Library tab"
- extendedWaitUntil:
    visible: ".*Home.*"
    timeout: 20000
- tapOn: ".*Home.*"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "space-settings-link"
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink: "horologia://space/home/settings"
- extendedWaitUntil:
    visible: "Space settings"
    timeout: 20000
- assertVisible: "General"
- assertVisible: "Members"
- scrollUntilVisible:
    element: "Tags"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "new-tag-input"
- inputText: "mobile-check"
- pressKey: ENTER
- scrollUntilVisible:
    element: "Add tag"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: "Add tag"
- extendedWaitUntil:
    visible: "Tag mobile-check"
    timeout: 20000
- tapOn: "Delete tag mobile-check"
- extendedWaitUntil:
    notVisible: "Tag mobile-check"
    timeout: 20000
- scrollUntilVisible:
    element: "Danger zone"
    direction: DOWN
    timeout: 20000
- assertVisible: "Delete space"
