appId: dev.horologia.mobile
---
- launchApp
- openLink: "horologia://tasks"
- runFlow:
    when:
      visible: "Open in.*Horologia.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "My Tasks"
    timeout: 20000
- openLink: "horologia://task/new"
- runFlow:
    when:
      visible: "Open in.*Horologia.*"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible: "Runtime version:.*"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "New task"
    timeout: 20000
- tapOn:
    id: "task-title-input"
- inputText: "Mobile workflow check"
- pressKey: ENTER
- scrollUntilVisible:
    element: "Create task"
    direction: DOWN
    timeout: 20000
    speed: 80
    visibilityPercentage: 90
    centerElement: true
- tapOn: "Create task"
- extendedWaitUntil:
    visible: "Mobile workflow check"
    timeout: 20000
- tapOn: "Edit"
- tapOn:
    id: "task-title-input"
- eraseText: 100
- inputText: "Mobile workflow verified"
- pressKey: ENTER
- scrollUntilVisible:
    element: "Save task"
    direction: DOWN
    timeout: 20000
    speed: 80
    visibilityPercentage: 90
    centerElement: true
- tapOn: "Save task"
- extendedWaitUntil:
    visible: "Mobile workflow verified.*"
    timeout: 20000
- tapOn: "Delete"
- tapOn:
    text: "Delete"
    index: 1
- extendedWaitUntil:
    visible: "My Tasks"
    timeout: 20000
