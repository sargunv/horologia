[tasks.generate]
description = "Generate the TypeSpec KMP specification and Kotlin API client"
depends = ["//api:generate"]
run = "./gradlew :api-generated:syncOpenApiGeneratedSources"

[tasks.check]
description = "Run Kotlin and Gradle verification"
depends = ["generate"]
run = "./gradlew check"

[tasks.test]
description = "Run Android-hosted shared tests and Apple-native tests when available"
depends = ["generate"]
run = '''
set -eu

tasks=":shared:testAndroidHostTest"
if [ "$(uname -s)" = "Darwin" ]; then
  tasks="$tasks :shared:iosSimulatorArm64Test"
fi
./gradlew $tasks
'''

[tasks.build]
description = "Build the generated API, shared framework, and Android app"
depends = ["generate"]
run = "./gradlew build"

[tasks.android]
description = "Install and launch the debug app on a connected Android device"
depends = ["generate"]
run = '''
set -eu

serial="${ANDROID_SERIAL:-}"
if [ -z "$serial" ]; then
  devices="$(adb devices | awk 'NR > 1 && $2 == "device" { print $1 }')"
  count="$(printf '%s\n' "$devices" | awk 'NF { count++ } END { print count + 0 }')"
  if [ "$count" -eq 0 ]; then
    echo "No connected Android device is ready." >&2
    exit 1
  fi
  if [ "$count" -gt 1 ]; then
    echo "Multiple Android devices are ready; set ANDROID_SERIAL to select one:" >&2
    printf '%s\n' "$devices" >&2
    exit 1
  fi
  serial="$devices"
fi

if [ "$(adb -s "$serial" get-state 2>/dev/null || true)" != "device" ]; then
  echo "Android device '$serial' is not connected and ready." >&2
  exit 1
fi

server_port="${SERVER_PORT:-8080}"
web_port="${WEB_PORT:-5173}"
oidc_port="${OIDC_PORT:-5556}"
for port in "$server_port" "$web_port" "$oidc_port"; do
  adb -s "$serial" reverse "tcp:$port" "tcp:$port" >/dev/null
done
echo "Horologia dev server: http://localhost:$server_port"

ANDROID_SERIAL="$serial" ./gradlew :androidApp:installDebug
adb -s "$serial" shell am start -W -n dev.horologia.mobile/.MainActivity
'''

[tasks.ios]
description = "Build and launch the app on an available iOS simulator"
depends = ["generate"]
run = '''
set -eu

simulator="${IOS_SIMULATOR_UDID:-}"
if [ -z "$simulator" ]; then
  simulator="$(
    xcrun simctl list devices available |
      sed -nE 's/^[[:space:]]+.*\(([0-9A-Fa-f-]{36})\) \(Booted\)$/\1/p' |
      sed -n '1p'
  )"
fi
if [ -z "$simulator" ]; then
  simulator="$(
    xcrun simctl list devices available |
      sed -nE 's/^[[:space:]]+iPhone.*\(([0-9A-Fa-f-]{36})\) \((Booted|Shutdown)\)$/\1/p' |
      sed -n '1p'
  )"
fi
if [ -z "$simulator" ]; then
  echo "No available iOS simulator was found." >&2
  exit 1
fi

xcrun simctl boot "$simulator" 2>/dev/null || true
open -a Simulator --args -CurrentDeviceUDID "$simulator"
xcrun simctl bootstatus "$simulator" -b
xcodebuild \
  -project iosApp/Horologia.xcodeproj \
  -scheme Horologia \
  -configuration Debug \
  -sdk iphonesimulator \
  -destination "platform=iOS Simulator,id=$simulator" \
  -derivedDataPath iosApp/build \
  build
xcrun simctl install \
  "$simulator" \
  iosApp/build/Build/Products/Debug-iphonesimulator/Horologia.app
xcrun simctl launch "$simulator" dev.horologia.mobile
'''

[tasks.clean]
description = "Remove Gradle and Xcode build outputs"
run = '''
./gradlew clean
rm -rf iosApp/build
'''
