[tasks.dev]
description = "Start the Expo development server"
run = "pnpm exec expo start --dev-client"

[tasks.ios]
description = "Build and run the iOS app"
run = "pnpm exec expo run:ios --device"

[tasks.android]
description = "Build and run the Android app (boots the selected AVD if it's not running)"
run = "pnpm exec expo run:android --device"

[tasks.android-tunnel]
description = "Forward emulator localhost to the dev server and OIDC provider (required for sign-in on the emulator; re-run after every emulator boot)"
run = "adb reverse tcp:{{env.SERVER_PORT}} tcp:{{env.SERVER_PORT}} && adb reverse tcp:{{env.OIDC_PORT}} tcp:{{env.OIDC_PORT}}"

[tasks.generate]
description = "Generate native projects from repository-owned Expo configuration"
run = "pnpm exec expo prebuild --clean --no-install"

[tasks.check]
description = "Type-check and lint the mobile app"
run = "pnpm exec vp check --no-fmt"

[tasks.test]
description = "Run mobile unit tests"
run = "pnpm exec vitest run"

[tasks.build]
description = "Type-check the mobile app"
run = "pnpm exec tsc --noEmit"
