[tools]
"github:yonaskolb/XcodeGen" = "latest"

# The android-sdk mise plugin only puts cmdline-tools on PATH, so the tasks
# below reach for `emulator` and `adb` via $ANDROID_HOME directly.

[tasks._android-sdk-components]
description = "Provision Android SDK components into the mise-managed SDK root"
hide = true
run = """
yes | sdkmanager --licenses >/dev/null
sdkmanager \
  "platform-tools" \
  "emulator" \
  "build-tools;$ANDROID_BUILD_TOOLS" \
  "platforms;android-$ANDROID_COMPILE_SDK" \
  "system-images;android-$ANDROID_COMPILE_SDK;google_apis;arm64-v8a"
"""

[tasks._android-avd]
description = "Create the horologia AVD if it doesn't already exist"
hide = true
depends = ["_android-sdk-components"]
run = """
if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx horologia; then
  echo "no" | avdmanager create avd \
    --name horologia \
    --package "system-images;android-$ANDROID_COMPILE_SDK;google_apis;arm64-v8a" \
    --device pixel_9_pro
fi
"""

[tasks.setup]
description = "Install mobile prerequisites, including Android SDK + horologia AVD"
depends = ["_android-sdk-components", "_android-avd"]

[tasks."build:core"]
description = "Build the shared mobile core for host-safe targets"
run = "./gradlew :core:desktopJar"

[tasks."build:desktop"]
description = "Build the desktop compose app"
run = "./gradlew :compose-app:desktopJar"

[tasks."build:android"]
description = "Build the Android compose app"
depends = ["_android-sdk-components"]
run = "./gradlew :compose-app:assembleDebug"

[tasks.build]
description = "Build the shared core plus desktop and Android apps"
depends = ["_android-sdk-components"]
run = "./gradlew :core:desktopJar :compose-app:desktopJar :compose-app:assembleDebug"

[tasks.test]
description = "Run the shared mobile core tests on desktop JVM"
run = "./gradlew :core:desktopTest"

[tasks."android:assembleDebug"]
description = "Assemble the Android debug app"
run = "./gradlew :compose-app:assembleDebug"

[tasks."android:installDebug"]
description = "Install the Android debug app"
run = "./gradlew :compose-app:installDebug"

[tasks."android:emulator"]
description = "Boot the horologia Android emulator (foreground; Ctrl-C to shut down)"
depends = ["_android-avd"]
run = "\"$ANDROID_HOME/emulator/emulator\" -avd horologia -netdelay none -netspeed full"

[tasks."android:run"]
description = "Install the debug APK on the running emulator and launch MainActivity"
depends = ["android:installDebug"]
run = "\"$ANDROID_HOME/platform-tools/adb\" shell am start -n dev.horologia.mobile.compose/.MainActivity"

[tasks."desktop:run"]
description = "Run the desktop app"
run = "./gradlew :compose-app:run"

[tasks."ios:gen"]
description = "Generate the iosApp Xcode project from project.yml"
run = """
cd swiftui-app
if [ ! -f Developer.xcconfig ]; then
  cp Developer.xcconfig.example Developer.xcconfig
  echo "Created swiftui-app/Developer.xcconfig from template — fill in DEVELOPMENT_TEAM before building."
fi
xcodegen
"""

[tasks."ios:xcframework"]
description = "Assemble the HorologiaCore XCFramework for iOS"
run = "./gradlew :core:assembleHorologiaCoreXCFramework"

[tasks."ios:build"]
description = "Build the iosApp for the iOS simulator"
depends = ["ios:gen"]
# Automatic signing with a real team (configured in project.yml) — required so
# `ProcessProductPackaging` emits the real `.xcent` with the keychain-access-group entitlement,
# which SecItemAdd needs to avoid OSStatus -34018 on simulator writes.
run = "xcodebuild -project swiftui-app/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug build"

[tasks."ios:boot"]
description = "Boot an iOS 26 simulator (iPhone 17 by default) if none is currently booted"
run = """
if ! xcrun simctl list devices booted | grep -q Booted; then
  DEVICE_ID=$(xcrun simctl list devices available | awk '/-- iOS 26/{flag=1;next}/^--/{flag=0}flag && /iPhone 17 \\(/{print; exit}' | sed -E 's/.*\\(([0-9A-F-]+)\\).*/\\1/')
  if [ -z "$DEVICE_ID" ]; then
    echo "No iPhone 17 (iOS 26) simulator found. Create one in Xcode → Devices & Simulators." >&2
    exit 1
  fi
  xcrun simctl boot "$DEVICE_ID"
  open -a Simulator
fi
"""

[tasks."ios:run"]
description = "Build, install, and launch the iosApp on the booted simulator"
depends = ["ios:boot", "ios:build"]
run = """
APP=$(ls -dt ~/Library/Developer/Xcode/DerivedData/iosApp-*/Build/Products/Debug-iphonesimulator/iosApp.app 2>/dev/null | head -1)
if [ -z "$APP" ]; then
  echo "iosApp.app not found in DerivedData; the build must have failed." >&2
  exit 1
fi
BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
xcrun simctl terminate booted "$BUNDLE_ID" 2>/dev/null || true
xcrun simctl install booted "$APP"
xcrun simctl launch booted "$BUNDLE_ID"
"""

[tasks."ios:open"]
description = "Open the iosApp Xcode project"
depends = ["ios:gen"]
run = "open swiftui-app/iosApp.xcodeproj"

[tasks."macos:build"]
description = "Build the iosApp as a native macOS app"
depends = ["ios:gen"]
# First-time build needs `-allowProvisioningUpdates` so Xcode can register this
# Mac with your developer account. If it still fails, open the project in Xcode
# once and click "Try Again" in Signing & Capabilities.
run = "xcodebuild -project swiftui-app/iosApp.xcodeproj -scheme iosApp -destination 'platform=macOS,arch=arm64' -configuration Debug -allowProvisioningUpdates build"

[tasks."macos:run"]
description = "Build and launch the iosApp as a native macOS app"
depends = ["macos:build"]
run = """
APP=$(ls -dt ~/Library/Developer/Xcode/DerivedData/iosApp-*/Build/Products/Debug/iosApp.app 2>/dev/null | head -1)
if [ -z "$APP" ]; then
  echo "iosApp.app not found in DerivedData; the macOS build must have failed." >&2
  exit 1
fi
open "$APP"
"""

[tasks.check]
description = "Run host-safe shared mobile checks"
run = "./gradlew :core:compileKotlinDesktop :core:desktopTest :compose-app:compileKotlinDesktop"

[tasks.fix]
description = "Format Kotlin and Gradle files"
run = "cd ../.. && mise x -- dprint fmt --allow-no-files clients/native/**/*.kt clients/native/**/*.kts clients/native/**/*.toml"
