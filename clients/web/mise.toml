[tasks.generate]
description = "Run all code generation"
depends = ["//packages/client-core:generate"]
sources = ["../../api/gen/openapi.yaml", "src/routes/**/*.tsx"]
outputs = ["src/routeTree.gen.ts"]
run = "pnpm exec tsr generate"

[tasks.dev]
description = "Start dev server"
run = "pnpm exec vp dev"

[tasks.build]
description = "Build for production"
depends = ["generate"]
run = "pnpm exec vp build"

[tasks.test]
description = "Run tests"
run = "pnpm exec vitest run"
