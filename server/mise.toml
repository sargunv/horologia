[tasks.generate]
description = "Run all code generation"
depends = ["//api:generate"]
sources = [
  "../api/tsp-output/schema/openapi.yaml",
  "internal/database/migrations/*.sql",
  "internal/database/queries/*.sql",
  "sqlc.yaml",
]
outputs = ["internal/database/gen/*.go", "internal/mcp/gen/*.go"]
run = [
  "go run github.com/sqlc-dev/sqlc/cmd/sqlc generate",
]

[tasks.build]
description = "Build server binary"
depends = ["generate"]
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["horologia-server"]
run = "go build -o horologia-server ./cmd/server"

[tasks.test]
description = "Run tests"
depends = ["generate"]
sources = ["**/*.go", "go.mod", "go.sum"]
run = "go test ./..."

[tasks.run]
description = "Run the server"
run = "./horologia-server serve"

[tasks.seed]
description = "Create default admin user"
depends = ["build"]
run = "./horologia-server create-admin --email admin@localhost --name Admin --password password"

[tasks.build-dev-oidc]
description = "Build dev OIDC server"
depends = ["generate"]
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["dev-oidc"]
run = "go build -o dev-oidc ./cmd/dev-oidc"

[tasks.run-dev-oidc]
description = "Run dev OIDC server"
run = "./dev-oidc"
