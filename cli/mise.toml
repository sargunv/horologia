[tasks.build]
description = "Build CLI binary"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["tend"]
run = "go build -o tend ."

[tasks.test]
description = "Run tests"
sources = ["**/*.go", "go.mod", "go.sum"]
run = "go test ./..."

[tasks.run]
description = "Run the CLI"
depends = ["build"]
run = "./tend"
