# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Not yet supported:
# - Go workspaces (go.work): https://github.com/dependabot/dependabot-core/issues/6012
# - mise tool versions: https://github.com/dependabot/dependabot-core/issues/12320
version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-api-deps:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /clients/cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-cli-deps:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-server-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /clients/native
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: gradle-wrapper
    groups:
      gradle-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
