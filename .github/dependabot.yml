# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Not yet supported:
# - Go workspaces (go.work): https://github.com/dependabot/dependabot-core/issues/6012
# - mise tool versions: https://github.com/dependabot/dependabot-core/issues/12320
version: 2
cooldown:
  default-days: 3
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
