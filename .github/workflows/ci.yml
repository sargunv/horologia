name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true
          install: false

      - name: Compute Android SDK cache key inputs
        id: android-sdk
        run: |
          {
            echo "sdk_version=$(mise config get tools.android-sdk)"
            echo "build_tools=$(mise config get env.ANDROID_BUILD_TOOLS)"
            echo "compile_sdk=$(mise config get env.ANDROID_COMPILE_SDK)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle.properties', 'mobile/gradle/libs.versions.toml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK components
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/share/mise/installs/android-sdk/${{ steps.android-sdk.outputs.sdk_version }}/build-tools
            ~/.local/share/mise/installs/android-sdk/${{ steps.android-sdk.outputs.sdk_version }}/licenses
            ~/.local/share/mise/installs/android-sdk/${{ steps.android-sdk.outputs.sdk_version }}/platform-tools
            ~/.local/share/mise/installs/android-sdk/${{ steps.android-sdk.outputs.sdk_version }}/platforms
          key: ${{ runner.os }}-android-sdk-${{ steps.android-sdk.outputs.sdk_version }}-build-tools-${{ steps.android-sdk.outputs.build_tools }}-platform-${{ steps.android-sdk.outputs.compile_sdk }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-${{ steps.android-sdk.outputs.sdk_version }}-
            ${{ runner.os }}-android-sdk-

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true
          install: true

      - run: mise run ci

  release-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true
          install: false

      - name: Compute release image name
        id: release-image
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build release snapshot
        env:
          IMAGE: ${{ steps.release-image.outputs.image }}
        run: mise run release:snapshot
