name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-ci-deps

      - run: mise run ci

  apple-ci:
    runs-on: macos-latest

    env:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-ci-deps

      # Pick the newest installed Xcode. CI deployment target is iOS/macOS 26, so the
      # runner image needs a matching SDK. If the build fails with "unsupported SDK",
      # either the image is behind or the project bumped past what's available.
      - name: Select newest Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | sort -rV | head -1)"

      - run: mise run //clients/native:ios:build

      - run: mise run //clients/native:macos:build

  release-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-ci-deps

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build release snapshot
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: mise run release:snapshot

      - name: Upload release snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
          if-no-files-found: error
