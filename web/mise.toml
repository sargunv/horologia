[tasks.generate]
description = "Run all code generation"
depends = ["//api:build"]
sources = ["../api/tsp-output/schema/openapi.yaml", "src/routes/**/*.tsx"]
outputs = ["src/api/schema.d.ts", "src/routeTree.gen.ts"]
run = [
  "pnpm exec openapi-typescript ../api/tsp-output/schema/openapi.yaml -o src/api/schema.d.ts",
  "pnpm exec tsr generate",
]

[tasks.dev]
description = "Start dev server"
depends = ["generate"]
run = "pnpm exec vp dev"

[tasks.build]
description = "Build for production"
depends = ["generate"]
run = "pnpm exec vp build"

[tasks.test]
description = "Run tests"
run = "pnpm exec vitest run"
