[settings]
experimental = true
pin = true

[settings.node]
corepack = true

[tools]
go = "1.26.1"
node = "25.8.1"
dprint = "0.53.0"
hk = "1.38.0"
golangci-lint = "2.11.3"
pkl = "0.31.0"
"github:sargunv/jvl" = "2026.03.01"

[hooks]
postinstall = [
  "hk install --mise",
  "cd web && pnpm install",
  "go mod download",
]

[tasks.check]
description = "Run all checks"
run = "hk check --all"

[tasks.fix]
description = "Fix all auto-fixable issues"
run = "hk fix --all"
