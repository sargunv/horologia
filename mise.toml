experimental_monorepo_root = true

[monorepo]
config_roots = [
  "api",
  "cli",
  "server",
  "web",
]

[settings]
experimental = true
pin = true

[settings.node]
corepack = true

[tools]
go = "1.26.1"
node = "25.8.1"
dprint = "0.53.0"
hk = "1.38.0"
golangci-lint = "2.11.3"
pkl = "0.31.0"
"github:sargunv/jvl" = "2026.03.01"
tilt = "0.37.0"

[hooks]
postinstall = [
  "hk install --mise",
  "pnpm install",
  "go mod download",
]

[tasks.generate]
description = "Run all code generation"
depends = ["//*:generate"]

[tasks.build]
description = "Build all packages"
depends = ["//*:build"]

[tasks.test]
description = "Run all tests"
depends = ["//*:test"]

[tasks.check]
description = "Run all checks"
run = "hk check --all"

[tasks.fix]
description = "Fix all auto-fixable issues"
run = "hk fix --all"

[tasks.dev]
description = "Start local dev environment"
run = "tilt up"
