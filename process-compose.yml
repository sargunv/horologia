version: "0.5"

environment:
  - "TEND_DB=server/tend.db"
  - "TEND_LOG_FORMAT=text"
  - "TEND_LOG_LEVEL=debug"
  - "TEND_OIDC_ISSUER=http://localhost:5556/"
  - "TEND_OIDC_CLIENT_ID=tend"
  - "TEND_OIDC_CLIENT_SECRET=tend-dev-secret"
  - "TEND_OIDC_REDIRECT_URL=http://localhost:8080/auth/oidc/callback"

processes:
  server:
    command: air
    working_dir: ./server
    depends_on:
      oidc:
        condition: process_healthy
    readiness_probe:
      exec:
        command: "nc -z localhost 8080"
      initial_delay_seconds: 2
      period_seconds: 5
      failure_threshold: 10

  web:
    command: pnpm exec vp dev
    working_dir: ./web
    depends_on:
      server:
        condition: process_healthy

  oidc:
    command: go run ./cmd/dev-oidc
    working_dir: ./server
    readiness_probe:
      http_get:
        host: localhost
        port: 5556
        path: /.well-known/openid-configuration
      initial_delay_seconds: 2
      period_seconds: 5
      failure_threshold: 10
