name: iosApp
options:
  bundleIdPrefix: dev.horologia.mobile
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        HorologiaBaseUrl: $(HOROLOGIA_BASE_URL)
        HorologiaDevToken: $(HOROLOGIA_DEV_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horologia.mobile.iosApp
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework HorologiaCore
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build HorologiaCore framework for Xcode
        script: |
          # Xcode scrubs PATH, so hunt for mise in the usual spots to pick up
          # the mise-managed Java. If none of these apply to your setup, either
          # export JAVA_HOME before building or add your mise path here.
          for candidate in \
            "/etc/profiles/per-user/$USER/bin/mise" \
            "$HOME/.local/bin/mise" \
            "/opt/homebrew/bin/mise" \
            "/usr/local/bin/mise"; do
            if [ -x "$candidate" ]; then
              eval "$("$candidate" env -s bash)"
              break
            fi
          done
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
