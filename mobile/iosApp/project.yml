name: iosApp
options:
  bundleIdPrefix: dev.horologia.mobile
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      # Info.plist is generated into this path by xcodegen on every run.
      # The file itself is gitignored (see .gitignore).
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Mirrors BrowserLauncher.ios.kt REDIRECT_URI.
        CFBundleURLTypes:
          - CFBundleURLName: dev.horologia.mobile.oauth
            CFBundleURLSchemes:
              - horologia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horologia.mobile.iosApp
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework HorologiaCore
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Required for SecItemAdd — without a keychain-access-group the simulator returns
        # errSecMissingEntitlement (-34018). File contents live at iosApp/iosApp.entitlements.
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        # Automatic signing with a real team ID — the simulator's keychain won't accept an
        # ad-hoc-signed app (`ProcessProductPackaging` writes an empty .xcent without a team,
        # so the keychain-access-group entitlement is stripped at codesign time).
        # TODO(multi-dev): hoist to a gitignored .xcconfig or per-user override so collaborators
        # can plug in their own team without editing this file.
        DEVELOPMENT_TEAM: LQ33A6CSK4
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build HorologiaCore framework for Xcode
        script: |
          # Xcode scrubs PATH, so hunt for mise in the usual spots to pick up
          # the mise-managed Java. If none of these apply to your setup, either
          # export JAVA_HOME before building or add your mise path here.
          for candidate in \
            "/etc/profiles/per-user/$USER/bin/mise" \
            "$HOME/.local/bin/mise" \
            "/opt/homebrew/bin/mise" \
            "/usr/local/bin/mise"; do
            if [ -x "$candidate" ]; then
              eval "$("$candidate" env -s bash)"
              break
            fi
          done
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
