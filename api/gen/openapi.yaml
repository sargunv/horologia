openapi: 3.1.0
info:
  title: Horologia API
  version: 0.0.0
tags:
  - name: Auth
  - name: Users
  - name: Spaces
  - name: SpaceMembers
  - name: Tags
  - name: Tasks
  - name: Task Statuses
  - name: Task Effort Levels
  - name: Task Priority Levels
  - name: Activity
paths:
  /app/auth/config:
    get:
      operationId: WebAuth_config
      description: Read public authentication configuration used by the web UI before login.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Auth
      security:
        - {}
  /app/auth/link:
    post:
      operationId: WebAuth_link
      description: |-
        Confirm OIDC account linking using the existing account password.

        This endpoint relies on the temporary `horologia_oidc_link` cookie issued
        during the OIDC callback. On success it creates the normal
        `horologia_session` cookie and clears the pending link cookie. This
        endpoint is only available when OIDC link consent is enabled.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLinkResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLinkRequest'
      security:
        - {}
  /app/auth/link/pending:
    get:
      operationId: WebAuth_linkPending
      description: |-
        Read the pending OIDC account-link request created during the OIDC callback.

        This endpoint relies on the temporary `horologia_oidc_link` cookie and is
        only available when OIDC link consent is enabled.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLinkPendingResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Auth
      security:
        - {}
  /app/auth/login:
    post:
      operationId: WebAuth_login
      description: |-
        Log in with email and password.

        Returns the authenticated user and sets the `horologia_session` cookie on
        success. This endpoint is only available when password auth is enabled.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      security:
        - {}
  /app/auth/logout:
    post:
      operationId: WebAuth_logout
      description: Clear the current browser session.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Auth
      security:
        - {}
  /auth/tokens:
    get:
