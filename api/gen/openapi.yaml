          type: array
          items:
            type: string
          maxItems: 100
        rotationPool:
          type: array
          items:
            type: string
          maxItems: 100
        tags:
          type: array
          items:
            type: string
          maxItems: 100
        due:
          anyOf:
            - $ref: '#/components/schemas/TaskDue'
