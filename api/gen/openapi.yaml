security:
  - BearerAuth: []
components:
  parameters:
    PageParams.cursor:
      name: cursor
      in: query
      required: false
      description: Pagination cursor from a previous response.
      schema:
        type: string
      explode: false
    PageParams.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (1–100).
      schema:
        type: integer
        format: int32
      explode: false
  schemas:
    ActivityAction:
      type: string
      enum:
        - created
        - updated
        - deleted
    ActivityDetail:
      type: object
      required:
        - field
        - from
        - to
      properties:
        field:
          type: string
        from:
          anyOf:
            - type: string
            - type: 'null'
        to:
          anyOf:
            - type: string
            - type: 'null'
    ActivityEntityType:
      type: string
      enum:
        - task
        - space
        - member
        - tag
        - status
        - effort_level
        - priority_level
        - relation
    ActivityLogEntry:
      type: object
      required:
        - id
        - spaceSlug
        - actorId
        - tokenId
        - tokenName
        - entityType
        - entityId
        - action
        - details
        - createdAt
      properties:
        id:
          type: string
        spaceSlug:
          type: string
        actorId:
          anyOf:
            - type: string
            - type: 'null'
        tokenId:
          anyOf:
            - type: string
            - type: 'null'
        tokenName:
          anyOf:
            - type: string
            - type: 'null'
        entityType:
          $ref: '#/components/schemas/ActivityEntityType'
        entityId:
          type: string
        action:
          $ref: '#/components/schemas/ActivityAction'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDetail'
        createdAt:
          type: string
          format: date-time
    ActivityLogPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLogEntry'
        nextCursor:
          anyOf:
            - type: string
            - type: 'null'
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    AppearanceMode:
      type: string
      enum:
        - system
        - light
        - dark
    AuthConfig:
      type: object
      required:
        - oidc
        - password
      properties:
        oidc:
          $ref: '#/components/schemas/AuthConfigOIDC'
        password:
          $ref: '#/components/schemas/AuthConfigPassword'
    AuthConfigOIDC:
      type: object
      required:
        - enabled
        - label
        - autoRedirect
      properties:
        enabled:
          type: boolean
        label:
          type: string
        autoRedirect:
          type: boolean
    AuthConfigPassword:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    AuthLinkPendingResponse:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
        name:
          type: string
    AuthLinkRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
    AuthLinkResponse:
      type: object
      required:
        - redirectTo
      properties:
        redirectTo:
          type: string
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    AuthLoginResponse:
      type: object
      required:
