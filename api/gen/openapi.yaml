          type: integer
          format: int64
        icon:
          type: string
          description: Lucide icon name in kebab-case (e.g. "gauge", "flame"). Empty string if no icon is set.
    TaskEffortLevelInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        icon:
          type: string
          maxLength: 50
