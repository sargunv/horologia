  /tasks/search:
    get:
      operationId: Tasks_search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query.
          schema:
            type: string
            minLength: 1
          explode: false
        - name: spaceSlug
          in: query
          required: false
          description: Optional space slug to restrict results to a single space.
          schema:
            type: string
          explode: false
        - name: excludeTaskId
          in: query
          required: false
          description: Optional task ID to exclude from results.
          schema:
            type: string
          explode: false
        - name: limit
