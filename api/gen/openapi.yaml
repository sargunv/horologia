        - recurrenceRule
        - lastCompletedAt
        - assigneeIds
        - rotationPool
        - tags
        - relations
        - due
        - overdueActionRule
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        spaceSlug:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        effort:
          anyOf:
