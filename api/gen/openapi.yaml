            - $ref: '#/components/schemas/TaskRecurrenceType'
          description: Recurrence type (e.g. one_off, completion_based, fixed_accumulating).
        recurrenceRule:
          type: string
          minLength: 1
          maxLength: 500
          description: Recurrence rule (RRULE string, max 500 chars).
