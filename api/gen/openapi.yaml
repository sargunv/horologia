        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Task title (1–500 chars).
        description:
          type: string
          maxLength: 10000
          description: Task description (max 10000 chars).
        status:
          type: string
          description: Initial status name. Defaults to the space's first status.
        effort:
          type: string
          minLength: 1
          maxLength: 100
