[tasks.generate]
description = "Compile TypeSpec and generate the shared Go API package"
run = [
  "pnpm --filter @horologia/typespec-mcp-go run build",
  "pnpm exec tsp compile .",
  "go run github.com/ogen-go/ogen/cmd/ogen --target gen/go/ogen --package gen --clean gen/openapi.yaml",
]
sources = ["main.tsp", "src/**/*.tsp", "tspconfig.yaml", "emitters/**/*.ts"]
outputs = ["gen/openapi.yaml", "gen/go/ogen/*.go", "gen/go/mcp/*.go"]

[tasks.build]
description = "Compile TypeSpec and generate the shared Go API package"
depends = ["generate"]
run = "true"
sources = [
  "main.tsp",
  "src/**/*.tsp",
  "tspconfig.yaml",
  "emitters/**/*.ts",
  "gen/openapi.yaml",
  "gen/go/ogen/*.go",
  "gen/go/mcp/*.go",
]
outputs = ["gen/openapi.yaml", "gen/go/ogen/*.go", "gen/go/mcp/*.go"]
