emit:
  - "@typespec/openapi3"
  - "@horologia/typespec-mcp-go"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/gen"
    openapi-versions:
      - 3.1.0
  "@horologia/typespec-mcp-go":
    emitter-output-dir: "{project-root}/gen/go/mcp"
    ogenImportPath: "github.com/sargunv/horologia/api/gen/go/ogen"
