# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: horologia

snapshot:
  version_template: 0.0.0-snapshot.{{ .ShortCommit }}

builds:
  - id: horologia
    dir: cli
    main: .
    binary: horo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/sargunv/horologia/cli/internal/cmd.version={{ .Version }}
        -X github.com/sargunv/horologia/cli/internal/cmd.commit={{ .Commit }}

archives:
  - id: horologia
    ids: [horologia]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
