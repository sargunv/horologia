# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: horologia

snapshot:
  version_template: 0.0.0-snapshot.{{ .ShortCommit }}

before:
  hooks:
    - sh -c 'RELEASE_VERSION="{{ .Version }}" GIT_COMMIT="{{ .Commit }}" ./scripts/prepare-release-artifacts.sh'

builds:
  - id: horologia-cli
    dir: cli
    main: .
    binary: horo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/sargunv/horologia/cli/internal/cmd.version={{ .Version }}
        -X github.com/sargunv/horologia/cli/internal/cmd.commit={{ .Commit }}

  - id: horologia-server
    dir: server
    main: ./cmd/server
    binary: horologia-server
    env:
      - CGO_ENABLED=0
    tags:
      - embedweb
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}

archives:
  - id: horologia-cli
    ids: [horologia-cli]
    formats: [tar.gz]
    name_template: >-
      horologia-cli_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: horologia-server
    ids: [horologia-server]
    formats: [tar.gz]
    name_template: >-
      horologia-server_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

dockers_v2:
  - ids: [horologia-server]
    images:
      - "{{ if .Env.IMAGE }}{{ .Env.IMAGE }}{{ else }}horologia{{ end }}"
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

docker_signs:
  - artifacts: all
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - horologia-cli
        - horologia-server
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: false

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

docker_digest:
  name_template: digests.txt

checksum:
  name_template: checksums.txt
